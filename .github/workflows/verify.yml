name: Verify clean checkout

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  backend:
    name: Backend, migrations and examples
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and verify a fresh fake-provider stack
        run: ./scripts/verify-backend.ps1
      - name: Upload test results and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-verification
          path: artifacts/verification/
          if-no-files-found: warn
          retention-days: 14

  client:
    name: C# client (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.423'
      - name: Restore the client and shipped adapter contract runner
        run: dotnet restore client/NpcMemory.Tests/NpcMemory.Tests.csproj
      - name: Compile the shipped core, adapter and starter sample
        run: dotnet build client/NpcMemory.Tests/NpcMemory.Tests.csproj --no-restore --configuration Release
      - name: Run loopback HTTP contract checks
        run: dotnet run --project client/NpcMemory.Tests --no-build --configuration Release
